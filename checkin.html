<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>เช็คอินช่าง — บจก. เจเอ็ม. เพ้นท์ติ้งแอนด์ซัพพลาย</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Sarabun', sans-serif; background: #F5F4F0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 40px; color: #1a1a1a; }
.header { text-align: center; margin-bottom: 24px; }
.logo-badge { display: inline-flex; align-items: center; gap: 8px; background: #1a1a1a; color: #fff; padding: 8px 18px; border-radius: 100px; font-size: 13px; font-weight: 600; margin-bottom: 16px; }
.logo-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.subtitle { font-size: 14px; color: #888; }
.card { background: #fff; border-radius: 20px; padding: 24px 20px; width: 100%; max-width: 400px; box-shadow: 0 2px 16px rgba(0,0,0,0.06); margin-bottom: 12px; }
.section-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #999; text-transform: uppercase; margin-bottom: 12px; }
.input-group { margin-bottom: 14px; }
.input-group label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 500; }
.input-group input, .input-group select { width: 100%; padding: 12px 14px; border: 1.5px solid #e8e8e8; border-radius: 12px; font-size: 15px; font-family: 'Sarabun', sans-serif; color: #1a1a1a; background: #fafafa; transition: border-color 0.15s; outline: none; appearance: none; }
.input-group input:focus, .input-group select:focus { border-color: #1a1a1a; background: #fff; }
.site-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.site-option { border: 1.5px solid #e8e8e8; border-radius: 12px; padding: 12px 10px; text-align: center; cursor: pointer; transition: all 0.15s; background: #fafafa; }
.site-option:hover { border-color: #ccc; }
.site-option.selected { border-color: #1a1a1a; background: #1a1a1a; color: #fff; }
.site-option.selected .site-floor { color: #aaa; }
.site-icon { font-size: 20px; margin-bottom: 4px; }
.site-name { font-size: 12px; font-weight: 600; }
.site-floor { font-size: 11px; color: #999; margin-top: 2px; }
.gps-strip { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid #e8e8e8; background: #fafafa; font-size: 13px; color: #888; }
.gps-strip.ok { border-color: #86efac; background: #f0fdf4; color: #166534; }
.gps-strip.error { border-color: #fca5a5; background: #fef2f2; color: #991b1b; }
.gps-strip.checking { border-color: #fde68a; background: #fffbeb; color: #92400e; }
.gps-icon { font-size: 18px; flex-shrink: 0; }
.gps-btn { margin-left: auto; background: #1a1a1a; color: #fff; border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-family: 'Sarabun', sans-serif; cursor: pointer; flex-shrink: 0; }
.gps-btn:disabled { background: #ccc; cursor: default; }
.camera-area { border: 2px dashed #e8e8e8; border-radius: 14px; overflow: hidden; aspect-ratio: 4/3; position: relative; cursor: pointer; background: #f5f5f5; display: flex; align-items: center; justify-content: center; }
.camera-area:hover { border-color: #bbb; }
.camera-placeholder { text-align: center; color: #bbb; pointer-events: none; }
.camera-placeholder .cam-icon { font-size: 32px; margin-bottom: 8px; }
.camera-placeholder p { font-size: 13px; }
#preview-img { width: 100%; height: 100%; object-fit: cover; display: none; }
.retake-btn { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-family: 'Sarabun', sans-serif; cursor: pointer; display: none; }
#camera-input { display: none; }
.submit-btn { width: 100%; max-width: 400px; padding: 16px; background: #1a1a1a; color: #fff; border: none; border-radius: 16px; font-size: 16px; font-weight: 600; font-family: 'Sarabun', sans-serif; cursor: pointer; margin-bottom: 12px; transition: opacity 0.15s; }
.submit-btn:disabled { background: #ccc; cursor: default; }
.checkout-btn { width: 100%; max-width: 400px; padding: 14px; background: #fff; color: #dc2626; border: 1.5px solid #fca5a5; border-radius: 16px; font-size: 15px; font-weight: 600; font-family: 'Sarabun', sans-serif; cursor: pointer; display: none; }
.overlay { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.9); z-index: 99; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.overlay.show { display: flex; }
.spinner { width: 40px; height: 40px; border: 3px solid #e5e5e5; border-top-color: #1a1a1a; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.overlay-text { font-size: 15px; color: #555; font-weight: 500; }
.success-screen { display: none; flex-direction: column; align-items: center; text-align: center; padding: 40px 20px; width: 100%; max-width: 400px; }
.success-screen.show { display: flex; }
.success-circle { width: 80px; height: 80px; background: #f0fdf4; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px; margin-bottom: 20px; }
.success-screen h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
.success-screen p { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 24px; }
.success-detail { font-size: 13px; background: #f5f4f0; border-radius: 12px; padding: 14px 18px; width: 100%; text-align: left; line-height: 1.9; }
.detail-row { display: flex; gap: 8px; }
.detail-key { color: #999; min-width: 60px; }
.detail-val { color: #1a1a1a; font-weight: 500; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1a1a1a; color: #fff; padding: 12px 20px; border-radius: 100px; font-size: 13px; font-weight: 500; transition: transform 0.3s; z-index: 200; white-space: nowrap; pointer-events: none; }
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Firebase CDN (compat version - ใช้กับ plain script ได้เลย) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="header">
  <div class="logo-badge"><div class="logo-dot"></div>บจก. เจเอ็ม. เพ้นท์ติ้งแอนด์ซัพพลาย</div>
  <h1>เช็คอินเข้างาน</h1>
  <p class="subtitle" id="today-label"></p>
</div>

<div id="main-form">
  <div class="card">
    <div class="section-label">ข้อมูลช่าง</div>
    <div class="input-group">
      <label>เลือกชื่อ *</label>
      <select id="name-select" onchange="onSelectMember(this.value)">
        <option value="">-- กำลังโหลดรายชื่อ --</option>
      </select>
    </div>
    <div id="tel-wrap" class="input-group" style="display:none;">
      <label>เบอร์โทรศัพท์</label>
      <input type="tel" id="tel" readonly style="background:#f5f5f5;color:#888;" />
    </div>
    <input type="hidden" id="name" />
  </div>

  <div class="card">
    <div class="section-label">เลือกไซต์งาน</div>
    <div class="site-grid" id="site-grid">
      <div style="color:#aaa;font-size:13px;padding:8px;grid-column:1/-1;">กำลังโหลดไซต์งาน...</div>
    </div>
  </div>

  <div class="card">
    <div class="section-label">ยืนยันตำแหน่ง GPS</div>
    <div class="gps-strip" id="gps-strip">
      <span class="gps-icon">📍</span>
      <span id="gps-text">กดปุ่มเพื่อตรวจสอบตำแหน่งของคุณ</span>
      <button class="gps-btn" id="gps-btn" onclick="checkGPS()">ตรวจสอบ</button>
    </div>
  </div>

  <div class="card">
    <div class="section-label">ถ่ายรูปหน้างาน *</div>
    <div class="camera-area" onclick="triggerCamera()">
      <div class="camera-placeholder" id="cam-placeholder">
        <div class="cam-icon">📷</div>
        <p>แตะเพื่อถ่ายรูปหน้างาน</p>
      </div>
      <img id="preview-img" alt="รูปหน้างาน" />
      <button class="retake-btn" id="retake-btn" onclick="retakePhoto(event)">ถ่ายใหม่</button>
    </div>
    <input type="file" id="camera-input" accept="image/*" capture="environment" onchange="handlePhoto(event)" />
  </div>
</div>

<button class="submit-btn" id="submit-btn" onclick="submitCheckin()" disabled>เช็คอินเข้างาน</button>
<button class="checkout-btn" id="checkout-btn" onclick="submitCheckout()">เช็คเอาท์ออกงาน</button>

<div class="success-screen" id="success-screen">
  <div class="success-circle">✅</div>
  <h2 id="success-title">เช็คอินสำเร็จ!</h2>
  <p id="success-msg">ระบบบันทึกข้อมูลแล้ว</p>
  <div class="success-detail" id="success-detail"></div>
</div>

<div class="overlay" id="overlay">
  <div class="spinner"></div>
  <div class="overlay-text" id="overlay-text">กำลังบันทึก...</div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──────────────────────────────
var FIREBASE_CFG = {
  apiKey: "AIzaSyDWyYUy2bMQr339i1rJw1CvvTZb2L9L1VI",
  authDomain: "jm-checkin.firebaseapp.com",
  databaseURL: "https://jm-checkin-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "jm-checkin",
  storageBucket: "jm-checkin.firebasestorage.app",
};
var LINE_NOTIFY_TOKEN = "YOUR_LINE_NOTIFY_TOKEN";
var LINE_PROXY = "https://YOUR_WORKER.workers.dev/notify";
// ────────────────────────────────────────

// ── Firebase Init ─────────────────────────
var firebaseApp = firebase.initializeApp(FIREBASE_CFG);
var db = firebase.database();

var SITES   = [];
var MEMBERS = [];
var selectedSite   = null;
var selectedMember = null;
var gpsOK        = false;
var photoData    = null;
var userCoords   = null;
var currentRecordId = null;
var siteParam = new URLSearchParams(location.search).get("site");

// Date
document.getElementById("today-label").textContent =
  new Date().toLocaleDateString("th-TH", { weekday:"long", day:"numeric", month:"long", year:"numeric" });

// ── Load Members ──────────────────────────
db.ref("members").on("value", function(snap) {
  MEMBERS = [];
  snap.forEach(function(c) {
    var m = c.val();
    if (m.status !== "inactive") MEMBERS.push(Object.assign({ key: c.key }, m));
  });
  var sel = document.getElementById("name-select");
  sel.innerHTML = '<option value="">-- เลือกชื่อทีมงาน --</option>';
  MEMBERS.forEach(function(m) {
    var opt = document.createElement("option");
    opt.value = m.key;
    opt.textContent = m.name + (m.position ? " (" + m.position + ")" : "");
    sel.appendChild(opt);
  });
});

// ── Load Sites ────────────────────────────
db.ref("sites").on("value", function(snap) {
  SITES = [];
  snap.forEach(function(c) {
    var s = c.val();
    if (s.status !== "inactive") SITES.push(Object.assign({ key: c.key }, s));
  });
  buildSiteGrid();
});

function buildSiteGrid() {
  var grid = document.getElementById("site-grid");
  grid.innerHTML = "";
  if (!SITES.length) {
    grid.innerHTML = '<div style="color:#aaa;font-size:13px;padding:8px;grid-column:1/-1;">ยังไม่มีไซต์งาน</div>';
    return;
  }
  SITES.forEach(function(s) {
    var el = document.createElement("div");
    el.className = "site-option";
    el.id = "site-key-" + s.key;
    el.innerHTML = '<div class="site-icon">🏗️</div><div class="site-name">' + s.name + '</div><div class="site-floor">' + (s.floor || "") + '</div>';
    el.onclick = function() {
      document.querySelectorAll(".site-option").forEach(function(x) { x.classList.remove("selected"); });
      el.classList.add("selected");
      selectedSite = s;
      gpsOK = false;
      document.getElementById("gps-strip").className = "gps-strip";
      document.getElementById("gps-text").textContent = "กดปุ่มเพื่อตรวจสอบตำแหน่งของคุณ";
      document.getElementById("gps-btn").disabled = false;
      checkReady();
    };
    grid.appendChild(el);
  });
  if (siteParam) {
    var found = SITES.find(function(s) { return s.siteId && s.siteId.toUpperCase() === siteParam.toUpperCase(); });
    if (found) { var el = document.getElementById("site-key-" + found.key); if (el) el.click(); }
  }
}

function onSelectMember(key) {
  selectedMember = MEMBERS.find(function(m) { return m.key === key; }) || null;
  document.getElementById("name").value = selectedMember ? selectedMember.name : "";
  if (selectedMember && selectedMember.tel) {
    document.getElementById("tel").value = selectedMember.tel;
    document.getElementById("tel-wrap").style.display = "block";
  } else {
    document.getElementById("tel").value = "";
    document.getElementById("tel-wrap").style.display = "none";
  }
  checkReady();
}

// ── GPS ───────────────────────────────────
function checkGPS() {
  var strip = document.getElementById("gps-strip");
  var txt   = document.getElementById("gps-text");
  var btn   = document.getElementById("gps-btn");
  strip.className = "gps-strip checking";
  txt.textContent = "กำลังดึงตำแหน่ง...";
  btn.disabled = true;
  if (!navigator.geolocation) {
    strip.className = "gps-strip error";
    txt.textContent = "อุปกรณ์ไม่รองรับ GPS";
    btn.disabled = false; return;
  }
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      userCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      if (!selectedSite) {
        strip.className = "gps-strip checking";
        txt.textContent = "พิกัด: " + userCoords.lat.toFixed(5) + ", " + userCoords.lng.toFixed(5) + " — กรุณาเลือกไซต์งาน";
        btn.disabled = false; gpsOK = false; checkReady(); return;
      }
      var dist = getDistance(userCoords.lat, userCoords.lng, selectedSite.lat, selectedSite.lng);
      if (dist <= (selectedSite.radius || 150)) {
        gpsOK = true;
        strip.className = "gps-strip ok";
        txt.textContent = "✓ อยู่ใน " + selectedSite.name + " (ห่าง " + Math.round(dist) + " ม.)";
      } else {
        gpsOK = false;
        strip.className = "gps-strip error";
        txt.textContent = "อยู่นอกพื้นที่ (ห่าง " + Math.round(dist) + " ม. จากไซต์)";
        btn.disabled = false;
      }
      checkReady();
    },
    function() {
      document.getElementById("gps-strip").className = "gps-strip error";
      document.getElementById("gps-text").textContent = "ไม่สามารถดึงตำแหน่งได้ — กรุณาอนุญาต Location";
      document.getElementById("gps-btn").disabled = false;
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function getDistance(lat1, lon1, lat2, lon2) {
  var R = 6371000, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ── Camera ────────────────────────────────
function triggerCamera() { document.getElementById("camera-input").click(); }

function handlePhoto(e) {
  var file = e.target.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement("canvas");
      var MAX = 800, w = img.width, h = img.height;
      if (w > h) { if (w > MAX) { h = h*MAX/w; w = MAX; } }
      else { if (h > MAX) { w = w*MAX/h; h = MAX; } }
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      photoData = canvas.toDataURL("image/jpeg", 0.7);
      document.getElementById("preview-img").src = photoData;
      document.getElementById("preview-img").style.display = "block";
      document.getElementById("cam-placeholder").style.display = "none";
      document.getElementById("retake-btn").style.display = "block";
      checkReady();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function retakePhoto(e) {
  e.stopPropagation(); photoData = null;
  document.getElementById("preview-img").style.display = "none";
  document.getElementById("cam-placeholder").style.display = "block";
  document.getElementById("retake-btn").style.display = "none";
  checkReady();
}

function checkReady() {
  var name = document.getElementById("name").value.trim();
  document.getElementById("submit-btn").disabled = !(name && selectedSite && gpsOK && photoData);
}

// ── Submit ────────────────────────────────
function submitCheckin() {
  var name = document.getElementById("name").value.trim();
  var tel  = document.getElementById("tel").value.trim();
  var now  = new Date();
  var timeStr = now.toLocaleTimeString("th-TH", { hour:"2-digit", minute:"2-digit" });
  var dateStr = now.toLocaleDateString("th-TH");

  showOverlay("กำลังบันทึกข้อมูล...");

  // บันทึกรูปเป็น base64 ลง Firebase Database โดยตรง (ไม่ต้องใช้ Storage)
  db.ref("checkins").push({
    name: name, tel: tel,
    site: selectedSite.name, siteFloor: selectedSite.floor || "",
    checkinTime: timeStr, checkinDate: dateStr, checkinTs: now.getTime(),
    lat: userCoords.lat, lng: userCoords.lng,
    photoData: photoData,
    photoURL: "",
    status: "in",
  })
  .then(function(newRef) {
    currentRecordId = newRef.key;
    notifyLine("✅ ช่างเช็คอิน\n👷 " + name + (tel?" ("+tel+")":"") + "\n📍 " + selectedSite.name + "\n🕐 " + timeStr + " น.\n🗓️ " + dateStr);
    hideOverlay();
    showSuccess(name, selectedSite.name, timeStr, dateStr);
  })
  .catch(function(err) { hideOverlay(); showToast("❌ " + err.message); });
}

function submitCheckout() {
  if (!currentRecordId) return;
  var now = new Date();
  var timeStr = now.toLocaleTimeString("th-TH", { hour:"2-digit", minute:"2-digit" });
  showOverlay("กำลังบันทึกเช็คเอาท์...");
  db.ref("checkins/" + currentRecordId).update({ checkoutTime: timeStr, checkoutTs: now.getTime(), status: "out" })
    .then(function() {
      var name = document.getElementById("name").value.trim();
      notifyLine("🔴 ช่างเช็คเอาท์\n👷 " + name + "\n📍 " + selectedSite.name + "\n🕐 " + timeStr + " น.");
      hideOverlay();
      document.getElementById("success-title").textContent = "เช็คเอาท์สำเร็จ!";
      document.getElementById("success-msg").textContent = "บันทึกเวลาออก " + timeStr + " น. เรียบร้อย";
      document.getElementById("checkout-btn").style.display = "none";
    })
    .catch(function(e) { hideOverlay(); showToast("❌ " + e.message); });
}

function notifyLine(msg) {
  try { fetch(LINE_PROXY, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({token:LINE_NOTIFY_TOKEN,message:msg}) }); } catch(e) {}
}

function showSuccess(name, site, time, date) {
  document.getElementById("main-form").style.display = "none";
  document.getElementById("submit-btn").style.display = "none";
  document.getElementById("success-screen").classList.add("show");
  document.getElementById("success-detail").innerHTML =
    '<div class="detail-row"><span class="detail-key">ชื่อ</span><span class="detail-val">'+name+'</span></div>' +
    '<div class="detail-row"><span class="detail-key">ไซต์</span><span class="detail-val">'+site+'</span></div>' +
    '<div class="detail-row"><span class="detail-key">เวลา</span><span class="detail-val">'+time+' น.</span></div>' +
    '<div class="detail-row"><span class="detail-key">วันที่</span><span class="detail-val">'+date+'</span></div>';
  document.getElementById("checkout-btn").style.display = "block";
}

function showOverlay(t) { document.getElementById("overlay-text").textContent=t; document.getElementById("overlay").classList.add("show"); }
function setOverlayText(t) { document.getElementById("overlay-text").textContent=t; }
function hideOverlay() { document.getElementById("overlay").classList.remove("show"); }
function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(function(){t.classList.remove("show");}, 3500);
}
</script>
</body>
</html>
